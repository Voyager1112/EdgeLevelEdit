			<input type="checkbox" id="autoNameCheck" checked> 自动命名
		</label>
		<label style="font-size:12px;color:#6a8aaa;">

    <div class="main-area">

			</div>
		</div>

					<button id="clearDecompileBtn" style="background:#a03030; border:1px solid #a03030; color:#fff; padding:4px 12px; border-radius:4px; cursor:pointer;">🗑️ 清除文件</button>
					<span style="color:#6a8aaa; font-size:12px;">选择 .bin 文件，然后点击反编译</span>
                    <label  for="decompileStaticMovingToPng"style="font-size:12px;color:#aaa;margin-left:8px;">
