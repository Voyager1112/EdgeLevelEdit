<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
    try { if (localStorage.getItem('edgeEditorDarkMode') === '1') document.documentElement.classList.add('dark'); } catch(e){}
    </script>
    <script src="./misc/electron-storage.js"></script>
    <script src="./js/online/three.min.js"></script>
    <script src="./js/online/OrbitControls.js"></script>
    <script src="./js/online/jszip.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edge 关卡xml编辑器3D 1.6.8</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./misc/favicon.png">
    <link rel="apple-touch-icon" href="./misc/favicon.png">
    <style>
/* ===================================================================
   Edge Level Editor — Windows 原生风格 · 直角 · 浅色 / 深色双主题
   =================================================================== */

:root{
    --bg:              #ffffff;
    --bg-toolbar:      #f3f3f3;
    --bg-panel:        #f7f7f7;
    --bg-canvas:       #f0f0f0;
    --bg-input:        #ffffff;
    --bg-button:       #fdfdfd;
    --bg-menu:         #ffffff;
    --bg-card:         #fafafa;
    --bg-log:          #fbfbfb;
    --bg-pixel:        #ffffff;
    --bg-grid:         #c9c9c9;
    --bg-waypoint:     #fff6e0;
    --bg-hover:        #eaf3fb;
    --bg-active:       #d6e8f8;
    --bg-three-ctrl:   rgba(255,255,255,.95);
    --border:          #dcdcdc;
    --border-strong:   #bcbcbc;
    --border-soft:     #f0f0f0;
    --text:            #1b1b1b;
    --text-dim:        #616161;
    --text-faint:      #8a8a8a;
    --accent:          #0067c0;
    --accent-hover:    #0a76cf;
    --accent-soft:     #e5f1fb;
    --on-accent:       #ffffff;
    --danger:          #c42b1c;
    --shadow-menu:     0 6px 20px rgba(0,0,0,.18);
    --shadow-modal:    0 12px 40px rgba(0,0,0,.28);
    --scroll-track:    #f2f2f2;
    --scroll-thumb:    #c2c2c2;
    --scroll-thumb-h:  #a6a6a6;
}

html.dark{
    --bg:              #1e1e1e;
    --bg-toolbar:      #2d2d2d;
    --bg-panel:        #252526;
    --bg-canvas:       #1b1b1b;
    --bg-input:        #2a2a2a;
    --bg-button:       #333333;
    --bg-menu:         #2d2d2d;
    --bg-card:         #2a2a2a;
    --bg-log:          #1a1a1a;
    --bg-pixel:        #2a2a2a;
    --bg-grid:         #444444;
    --bg-waypoint:     #3a2e1a;
    --bg-hover:        #2a3a4a;
    --bg-active:       #1a4a6a;
    --bg-three-ctrl:   rgba(45,45,45,.95);
    --border:          #3c3c3c;
    --border-strong:   #4a4a4a;
    --border-soft:     #333333;
    --text:            #e0e0e0;
    --text-dim:        #a0a0a0;
    --text-faint:      #707070;
    --accent:          #4fc3f7;
    --accent-hover:    #6dd0ff;
    --accent-soft:     #1a3a5a;
    --on-accent:       #0a0a0a;
    --danger:          #e05a4a;
    --shadow-menu:     0 6px 20px rgba(0,0,0,.55);
    --shadow-modal:    0 12px 40px rgba(0,0,0,.65);
    --scroll-track:    #252525;
    --scroll-thumb:    #4a4a4a;
    --scroll-thumb-h:  #5c5c5c;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }

body{
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "微软雅黑", system-ui, sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
}

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar{ width:12px; height:12px; }
::-webkit-scrollbar-track{ background: var(--scroll-track); }
::-webkit-scrollbar-thumb{ background: var(--scroll-thumb); border:3px solid var(--scroll-track); }
::-webkit-scrollbar-thumb:hover{ background: var(--scroll-thumb-h); }

/* ---------- 通用控件 ---------- */
input[type="text"],
input[type="number"],
input[type="search"],
select,
textarea{
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border-strong);
    padding: 2px 5px;
    height: 22px;
    outline: none;
    border-radius: 0;
}
textarea{ height: auto; }
input[type="text"]:focus,
input[type="number"]:focus,
select:focus,
textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
}
/*input[type="checkbox"]{
    width: 13px; height: 13px;
    accent-color: var(--accent);
    margin: 0;
    flex-shrink: 0;
    vertical-align: -2px;
}*/
input[type="checkbox"]{
    width: 13px !important; 
    height: 13px !important;
    flex: 0 0 auto !important;
    accent-color: var(--accent);
    margin: 0;
    vertical-align: -2px;
    cursor: pointer;
}
input[type="range"]{ accent-color: var(--accent); }
input[type="color"]{
    width: 36px; height: 22px;
    padding: 1px;
    border: 1px solid var(--border-strong);
    background: var(--bg-input);
    cursor: pointer;
    border-radius: 0;
}
button{
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--bg-button);
    border: 1px solid var(--border-strong);
    padding: 3px 10px;
    height: 24px;
    line-height: 16px;
    cursor: pointer;
    border-radius: 0;
    white-space: nowrap;
    transition: background .12s, border-color .12s, color .12s;
}
button:hover{ background: var(--bg-hover); border-color: #8fb8da; }
button:active{ background: var(--bg-active); }
button:disabled{ color: var(--text-faint); background: var(--bg-button); cursor:default; border-color: var(--border); }
button.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
}
button.primary:hover{ background: var(--accent-hover); border-color: var(--accent-hover); }
button.btn-danger{
    color: var(--danger);
    border-color: #d9a49f;
    background: var(--bg-button);
}
button.btn-danger:hover{ background: var(--danger); border-color: var(--danger); color:#fff; }
button.btn-sm{ padding: 1px 8px; height: 20px; font-size: 11px; }

/* ===================================================================
   工具栏
   =================================================================== */
.toolbar{
    background: var(--bg-toolbar);
    border-bottom: 1px solid var(--border-strong);
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 4px 6px;
    flex-shrink: 0;
    z-index: 10;
    transition: background .2s;
}
.tb-row{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    min-height: 24px;
}
.tb-row.center-row{ justify-content: center; }
.tb-row .spacer{ flex: 1 1 auto; }
.tb-group{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
}
.tb-label{
    color: var(--text-dim);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
}
.sep{
    width: 1px;
    height: 18px;
    background: var(--border-strong);
    margin: 0 3px;
    flex-shrink: 0;
}
.toolbar button,
.toolbar a{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 24px;
    padding: 0 10px;
    font-size: 12px;
    color: var(--text);
    background: var(--bg-button);
    border: 1px solid var(--border-strong);
    text-decoration: none;
    border-radius: 0;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s, border-color .12s, color .12s;
}
.toolbar a{ color: var(--text); }
.toolbar button:hover,
.toolbar a:hover{ background: var(--bg-hover); border-color: #8fb8da; }
.toolbar button:active,
.toolbar a:active{ background: var(--bg-active); }
.toolbar button.active,
.toolbar a.active{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
}
.toolbar button.sq{ width:24px; padding:0; font-size:14px; }
.toolbar button.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
}
.toolbar button.primary:hover{ background: var(--accent-hover); border-color: var(--accent-hover); }

.toolbar label{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    font-size: 12px;
    white-space: nowrap;
}
.toolbar input[type="text"],
.toolbar input[type="number"],
.toolbar select{
    height: 22px;
    font-size: 12px;
    padding: 1px 5px;
}

/* ---------- 下拉菜单 ---------- */
.dropdown{
    position: relative;
    display: inline-block;
}
.dropdown-menu{
    display: none;
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    min-width: 170px;
    background: var(--bg-menu);
    border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-menu);
    z-index: 200;
    padding: 2px;
}
.dropdown.open .dropdown-menu{ display: block; }
.toolbar .dropdown-menu button,
.toolbar .dropdown-menu a{
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    height: auto;
    min-height: 26px;
    padding: 4px 12px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 12px;
    text-align: left;
    text-decoration: none;
    white-space: nowrap;
}
.toolbar .dropdown-menu button:hover,
.toolbar .dropdown-menu a:hover{ background: var(--bg-hover); }

/* ---------- Level 属性条 ---------- */
.level-props{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    padding: 4px 10px;
    max-height: 400px;
    overflow: hidden;
    transition: max-height .25s ease, opacity .2s ease,
                padding .25s ease, border-width .25s ease;
}
.level-props.collapsed{
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-top-width: 0;
    border-bottom-width: 0;
    pointer-events: none;
}
.level-props label{ font-size: 11px; }
.level-props input{ font-size: 11px; }

/* 统一运动容器 */
#unifiedMovementContainer{
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    padding: 2px 8px;
    height: 24px;
}
#unifiedBaseSelect{ height: 20px; font-size: 11px; min-width: 130px; }
.chk{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
}

/* ===================================================================
   主区域
   =================================================================== */
.main-area{
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
}

/* ---------- 2D 画布 ---------- */
.canvas-wrapper{
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    position: relative;
    background: var(--bg-canvas);
}
.zoom-bar{
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 5px 16px;
    min-height: 34px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
}
.zoom-bar input[type="range"]{ width: 150px; }
.zoom-bar input[type="number"]{
    width: 62px;
    text-align: center;
    height: 22px;
}
.zoom-bar .zoom-layer-group{
    display: flex;
    align-items: center;
    gap: 4px;
    margin-right: 12px;
    padding-right: 12px;
    border-right: 1px solid var(--border);
}
.canvas-wrap{
    flex: 1;
    width: 100%;
    min-width: 0;
    overflow: auto;
    padding: 20px;
    background: var(--bg-canvas);
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    position: relative;
}
.canvas-wrap .grid-info{
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-menu);
    border: 1px solid var(--border);
    padding: 1px 8px;
    pointer-events: none;
    z-index: 5;
}
#gridWrapper{
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    flex-shrink: 0;
    position: relative;
    overflow: visible;
    width: auto;
    height: auto;
}
#pixelGrid{
    display: grid;
    gap: 1px;
    background: var(--bg-grid);
    border: 1px solid var(--border-strong);
    padding: 1px;
    transform-origin: center center;
    transition: transform .1s;
    position: relative;
    z-index: 1;
}
#radiusOverlay{
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

/* ---------- 网格单元 ---------- */
.pixel{
    width: 28px;
    height: 28px;
    background: var(--bg-pixel);
    cursor: pointer;
    position: relative;
    box-sizing: border-box;
    transition: box-shadow .08s;
}
.pixel:hover{
    box-shadow: inset 0 0 0 2px rgba(0,103,192,.55);
    z-index: 2;
}
.pixel .coord-label{
    position: absolute;
    bottom: 1px;
    right: 2px;
    font-size: 7px;
    font-family: Consolas, monospace;
    color: rgba(0,0,0,.28);
    pointer-events: none;
}
html.dark .pixel .coord-label{ color: rgba(255,255,255,.32); }
.pixel .elem-id{
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 8px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 3px #000, 0 1px 2px #000;
    pointer-events: none;
}
.pixel .waypoint-label{
    position: absolute;
    bottom: 1px;
    left: 2px;
    font-size: 7px;
    font-weight: 700;
    color: #ffcc44;
    text-shadow: 0 0 3px #000;
    pointer-events: none;
    z-index: 3;
}
.pixel .static-mode-label{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    font-size: 8px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 3px #000;
    pointer-events: none;
}
.pixel .spawn-label,
.pixel .exit-label{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    font-size: 9px;
    font-weight: 700;
    text-shadow: 0 0 3px #000, 0 1px 2px #000;
    pointer-events: none;
    z-index: 4;
}
.pixel .spawn-label{ color: #22ff99; }
.pixel .exit-label{ color: #ff5c5c; }
.pixel.static-block{ border: 1px solid rgba(0,0,0,.12); }
html.dark .pixel.static-block{ border-color: rgba(255,255,255,.12); }
.pixel.spawn{ outline: 2px dashed #00a35c; outline-offset: -2px; }
.pixel.exit{ outline: 2px dashed #d33a2c; outline-offset: -2px; }
.pixel.waypoint-dot{
    outline: 1px dashed #d18b00;
    outline-offset: -2px;
    background: var(--bg-waypoint) !important;
}
.pixel.selected{
    box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 2px rgba(0,103,192,.35);
    z-index: 5;
}
.pixel .static-rgb-indicator{
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 6px;
    height: 6px;
    border: 1px solid rgba(0,0,0,.25);
    pointer-events: none;
}
html.dark .pixel .static-rgb-indicator{ border-color: rgba(255,255,255,.25); }

/* ===================================================================
   右侧属性面板
   =================================================================== */
.panel{
    width: 340px;
    flex-shrink: 0;
    height: 100%;
    background: var(--bg-panel);
    border-left: 1px solid var(--border-strong);
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px;
    overflow-y: auto;
    font-size: 13px;
}
.panel h3{
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    padding-bottom: 3px;
    margin-bottom: 4px;
    flex-shrink: 0;
}
.panel .panel-content-area{
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 0;
}
.panel .elem-list-area{
    flex-shrink: 0;
    max-height: 220px;
    min-height: 70px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    padding-top: 4px;
    margin-top: 4px;
}
.panel .elem-list{
    background: var(--bg-input);
    border: 1px solid var(--border);
    padding: 2px;
    max-height: 190px;
    overflow-y: auto;
}
.panel .empty-msg{
    color: var(--text-faint);
    font-size: 12px;
    text-align: center;
    padding: 26px 0;
}
.panel .prop-row{
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 3px;
}
.panel .prop-row > label{
    color: var(--text-dim);
    min-width: 70px;
    font-size: 12px;
}
.panel .prop-row input,
.panel .prop-row select{
    flex: 1;
    min-width: 40px;
    height: 22px;
    font-size: 12px;
    padding: 1px 5px;
}
.panel .prop-row input[type="number"]{ flex: 0 1 62px; }
.panel .prop-row input[type="range"]{ flex: 1; min-width: 60px; height: auto; padding: 0; border: none; }
.panel .prop-row input[type="color"]{ flex: 0 0 auto; width: 36px; }
.panel .prop-row .remove-btn{
    flex: 0 0 auto;
    color: var(--danger);
    border-color: #d9a49f;
    background: var(--bg-button);
    padding: 1px 10px;
    height: 22px;
    font-size: 12px;
}
.panel .prop-row .remove-btn:hover{ background: var(--danger); border-color: var(--danger); color:#fff; }
.panel .prop-row .chk-title{
    color: var(--text-dim);
    min-width: 70px;
    font-size: 12px;
    flex-shrink: 0;
}
.panel .prop-row .chk-group{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex: 1;
}
.panel .prop-row .chk-group label,
.panel .prop-row .chk-label{
    min-width: auto;
    flex: 0 0 auto;
    color: var(--text-dim);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
}
.panel .add-btn{
    background: var(--bg-button);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 2px 12px;
    height: 22px;
    font-size: 12px;
    margin-top: 4px;
}
.panel .add-btn:hover{ background: var(--bg-hover); border-color: #8fb8da; }
.panel .waypoint-list{
    background: var(--bg-input);
    border: 1px solid var(--border);
    padding: 3px;
    max-height: 190px;
    overflow-y: auto;
    margin-top: 4px;
}
.panel .waypoint-item{
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
    padding: 3px 4px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 12px;
}
.panel .waypoint-item:last-child{ border-bottom: none; }
.panel .waypoint-item input{
    width: 46px;
    height: 20px;
    font-size: 11px;
    padding: 1px 4px;
}
.panel .waypoint-item .wp-label{
    color: #b07500;
    font-weight: 600;
    min-width: 30px;
}
html.dark .panel .waypoint-item .wp-label{ color: #e0b050; }
.panel .waypoint-item .wp-field-label{
    color: var(--text-faint);
    font-size: 10px;
}
.panel .sub-elem-section{
    border-top: 1px solid var(--border);
    padding-top: 6px;
    margin-top: 6px;
}
.panel .sub-title{
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 3px;
}
.panel .field-hint{
    font-size: 10px;
    color: var(--text-faint);
    margin-left: 4px;
}
.panel .rgb-presets{
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 4px 0;
}
.panel .rgb-presets button{
    padding: 1px 8px;
    height: 21px;
    font-size: 11px;
    background: var(--bg-button);
    border: 1px solid var(--border-strong);
}
.panel .rgb-presets button:hover{ background: var(--bg-hover); }

/* ---------- 元素列表 ---------- */
.elem-item{
    padding: 2px 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 6px;
    font-size: 12px;
    border-bottom: 1px solid var(--border-soft);
}
.elem-item:last-child{ border-bottom: none; }
.elem-item:hover{ background: var(--bg-hover); }
.elem-item.active{
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    padding-left: 4px;
}
.color-dot{
    display: inline-block;
    width: 11px;
    height: 11px;
    border: 1px solid rgba(0,0,0,.25);
    flex-shrink: 0;
}

/* ===================================================================
   状态栏
   =================================================================== */
.status-bar{
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-toolbar);
    border-top: 1px solid var(--border-strong);
    padding: 3px 14px;
    font-size: 12px;
    color: var(--text-dim);

/* ===================================================================

}

    white-space: nowrap !important;

/* ===================================================================

   =================================================================== */
.toast{

    color: var(--text);
    padding: 6px 20px;
    border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-menu);
    font-size: 13px;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
}
.toast.show{ opacity: 1; }

/* ===================================================================

   =================================================================== */
.select-dialog{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.28);

}

.select-dialog .dialog-box{

    min-width: 240px;
    max-width: 420px;
    color: var(--text);
}
.select-dialog .dialog-box h4{
    font-size: 13px;
    color: var(--text);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
}
.select-dialog .dialog-box button{
    display: block;
    width: 100%;
    text-align: left;
    margin: 3px 0;
    height: 26px;
    padding: 0 10px;

    border: 1px solid var(--border-strong);

}
.select-dialog .dialog-box button:hover{ background: var(--bg-hover); border-color: #8fb8da; }
.select-dialog .dialog-box .cancel-btn{
    text-align: center;
    margin-top: 10px;

}
.select-dialog .dialog-box .cancel-btn:hover{ background: var(--danger); border-color: var(--danger); color:#fff; }

/* ===================================================================
   帮助侧栏
   =================================================================== */
.help-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.22);
    z-index: 1999;
    display: none;
}
.help-overlay.active{ display: block; }

.help-sidebar{
    position: fixed;
    top: 0;
    right: -420px;
    width: 400px;
    height: 100%;
    background: var(--bg);
    border-left: 1px solid var(--border-strong);

}
.help-sidebar.active{ right: 0; }
.help-sidebar .help-header{
    flex-shrink: 0;
    display: flex;

    padding: 10px 16px;
    background: var(--bg-toolbar);

}
.help-sidebar .help-header h2{
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
}
.help-sidebar .help-header .close-btn{
    color: var(--danger);
    border-color: #d9a49f;
    background: var(--bg-button);

}
.help-sidebar .help-header .close-btn:hover{ background: var(--danger); border-color: var(--danger); color:#fff; }
.help-sidebar .help-body{

.help-sidebar .help-body h3{

.help-sidebar .help-body li{ margin: 4px 0; }
.help-sidebar .help-body ul{ padding-left: 20px; }
.help-sidebar .help-body code{

    font-size: 12px;

}

/* ===================================================================
   3D 视图
   =================================================================== */
.view3d-container{
    position: relative;

    flex: 0 0 0;
    height: 100%;

    flex-shrink: 0;
    transition: flex .3s ease;
}
.view3d-container.active{
    flex: 0 0 50%;
    display: flex;
}
#threeContainer{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
.three-controls{
    position: absolute;

    left: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;

}
.three-controls span{ color: var(--text-dim); font-size: 11px; }
.three-controls button{

}
.three-controls button:hover{ background: var(--bg-hover); border-color: #8fb8da; }
.three-controls .mode-btn.active{

}
.three-controls label{

    align-items: center;
    gap: 4px;
    color: var(--text-dim);

}
.three-controls input[type="number"]{
    width: 58px;
    height: 22px;
    font-size: 11px;
    text-align: center;
}
.view3d-container .close-3d{
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 61;
    color: var(--danger);
    border-color: #d9a49f;
    background: var(--bg-button);
    height: 24px;
    padding: 0 12px;
}
.view3d-container .close-3d:hover{ background: var(--danger); border-color: var(--danger); color:#fff; }
.view3d-container .reset-camera-btn{
    position: absolute;
    bottom: 10px;
    left: 10px;
    z-index: 61;
    height: 24px;
    padding: 0 12px;
    background: var(--bg-button);
}
.view3d-container .three-info{
    position: absolute;
    bottom: 10px;
    right: 12px;
    z-index: 60;
    font-size: 11px;

/* ===================================================================
   模态框（编译 / 设置）
   =================================================================== */
.modal{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.3);
    z-index: 3000;
    display: none;
    justify-content: center;
    align-items: center;
}
.modal.active{ display: flex; }
.modal-box{
    background: var(--bg);
    border: 1px solid #8a8a8a;
    box-shadow: var(--shadow-modal);
    width: 92%;
    max-width: 660px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    color: var(--text);
}
.modal-head{
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: var(--bg-toolbar);
    border-bottom: 1px solid var(--border-strong);
}
.modal-head h3{ font-size: 13px; font-weight: 600; color: var(--text); }
.modal-head h4{ font-size: 13px; font-weight: 600; }
.modal-body{
    padding: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 12px;
}
.modal-body label{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text-dim);
    font-size: 12px;
}
.modal-body label.chk{ cursor: pointer; }
.field-row{
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    align-items: center;
}
.field-block{
    display: flex;
    flex-direction: column;
    gap: 4px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    padding: 8px 10px;
}
.field-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}
.field-block input[type="file"]{
    width: 100%;
    font-size: 12px;
    color: var(--text-dim);
}
.btn-row{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}
.btn-row.right{ justify-content: flex-end; }
.section{
    border-top: 1px solid var(--border);
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.section h4{
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
}
.hint{ font-size: 11px; color: var(--text-faint); }
.log-box{
    background: var(--bg-log);
    border: 1px solid var(--border);
    padding: 6px 8px;
    max-height: 180px;
    overflow-y: auto;
    font-family: Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
    user-select: text;
}
.dl-area{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.dl-area:empty{ display: none; }

/* 设置面板 */
#settingsDialog .modal-box{ max-width: 460px; }
#settingsDialog .modal-body > label{
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    font-size: 12px;
}
#settingsDialog .modal-body input[type="text"]{ width: 200px; }

/* ===================================================================
   响应式
   =================================================================== */
@media (max-width: 900px){
    .panel{ width: 270px; padding: 6px 8px; }
    .pixel{ width: 22px; height: 22px; }

}

    .zoom-bar input[type="range"]{ width: 90px; }
}

<!-- ==================================================================

<div class="toolbar" id="toolbar">

    <!-- ───────── 第 1 行：顶部按钮栏 ───────── -->

        <!-- 文件下拉 -->

            <button class="dropdown-toggle">📁 文件 ▾</button>

                <button id="loadXmlBtn">📂 加载 XML+PNG</button>
                <button id="exportPngBtn">🖼 导出 PNG</button>

                <button id="exportZipBtn">📦 导出 ZIP</button>
            </div>
        </div>
        <input type="file" id="fileXmlInput" accept=".xml,.png,.zip" multiple style="display:none;">
        <button id="projectManagerBtn">📁 项目</button>

        <button id="compileBtn">📦 编译</button>

        <button class="primary" onclick="launchGame()">🎮 启动游戏</button>
        <button id="undoBtn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
        <button id="redoBtn" title="重做 (Ctrl+Y)">↷ 重做</button>

        <div class="spacer"></div>

        <!-- 工具下拉（靠右） -->
        <div class="dropdown">
            <button class="dropdown-toggle">🛠 工具 ▾</button>
            <div class="dropdown-menu">
                <button id="toolRecorderBtn">按键事件录制器</button>
                <a href="./misc/pic2lvlmap.html" target="_blank">图片转关卡地图</a>
                <a href="./misc/levelgen.html" target="_blank">关卡生成器</a>
                <a href="./misc/profedit.html" target="_blank">移动版存档编辑器</a>

    <div class="level-props" id="levelPropsArea">
        <label>ID <input type="text" id="levelId" value="10001" style="width:64px;"></label>

            <input type="number" id="sizeL" value="10" min="1" max="6000" style="width:60px;">×
            <input type="number" id="sizeH" value="3" min="1" max="1000" style="width:60px;">

        <label>Spawn <input type="text" id="spawnPoint" value="3,5,1" style="width:70px;" title="X,Y,Z (0基)"></label>

        <label>Theme <input type="number" id="levelTheme" value="0" min="0" max="3" style="width:48px;"></label>
        <label>MusicJava <input type="number" id="musicJava" value="0" min="0" max="11" style="width:48px;"></label>
        <label>Music <input type="number" id="music" value="6" min="0" max="24" style="width:48px;"></label>

        <label>FOV <input type="number" id="levelFov" value="22" min="0" max="184" style="width:52px;"></label>
        <label>ModelTheme <input type="number" id="modelTheme" value="0" min="0" style="width:48px;"></label>
    </div>

<!-- ==================================================================
     内联脚本：下拉菜单 + 夜间模式
     ================================================================== -->
<script>
(function () {

    /* ---------- 下拉菜单 ---------- */
    document.querySelectorAll('.dropdown-toggle').forEach(function (toggle) {
        toggle.addEventListener('click', function (e) {
            e.stopPropagation();
            var dropdown = toggle.closest('.dropdown');
            var isOpen = dropdown.classList.contains('open');
            document.querySelectorAll('.dropdown').forEach(function (d) {
                d.classList.remove('open');
            });
            if (!isOpen) dropdown.classList.add('open');
        });
    });

    document.addEventListener('click', function () {
        document.querySelectorAll('.dropdown').forEach(function (d) {
            d.classList.remove('open');
        });
    });

    /* 下拉菜单内的条目被点击后自动关闭 */
    document.querySelectorAll('.dropdown-menu').forEach(function (menu) {
        menu.addEventListener('click', function (e) {
            if (e.target.closest('button, a')) {
                var dropdown = menu.closest('.dropdown');
                if (dropdown) dropdown.classList.remove('open');
            }
        });
    });

    /* ---------- 夜间模式 ---------- */
    var darkCheck = document.getElementById('settingDarkMode');
    if (darkCheck) {
        try {
            darkCheck.checked = localStorage.getItem('edgeEditorDarkMode') === '1';
        } catch (e) {}

        darkCheck.addEventListener('change', function () {
            var on = this.checked;
            document.documentElement.classList.toggle('dark', on);
            try { localStorage.setItem('edgeEditorDarkMode', on ? '1' : '0'); } catch (e) {}
            // ★ 新增：触发 2D 画布和 3D 场景刷新颜色
            if (typeof requestRender === 'function') requestRender();
            if (typeof window.updateThreeTheme === 'function') window.updateThreeTheme();
        });
    }

})();
</script>
