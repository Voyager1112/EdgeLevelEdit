<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片转二色 / 灰阶工具</title>
<script src="../js/online/jszip.min.js"></script>
<script>
(function() {
	if (typeof JSZip === 'undefined') {
		var scriptZip = document.createElement('script');
		scriptZip.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
		document.head.appendChild(scriptZip);
	}
})();
</script>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#0f1115;color:#e8eaf0;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;
  }
  .app{display:flex;height:100vh;overflow:hidden}

  .panel{
    width:360px;flex:0 0 360px;height:100%;overflow-y:auto;
    background:#171a21;border-right:1px solid #262b35;padding:18px;
  }
  h1{font-size:15px;margin:0 0 16px;color:#fff;letter-spacing:.5px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#7f8798;margin:0 0 10px;font-weight:700}
  section{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #242a33}
  section:last-child{border-bottom:none;margin-bottom:0}

  .drop{
    border:1.5px dashed #333c4a;border-radius:10px;padding:22px 12px;
    text-align:center;color:#8b93a1;cursor:pointer;margin-bottom:16px;
    transition:.15s;font-size:13px;user-select:none;
  }
  .drop:hover,.drop.over{border-color:#5b8cff;color:#a8b6d8;background:#141a26}

  label{display:block;color:#c7ccd8;margin-bottom:8px}
  .row{display:flex;gap:10px}
  .row>label{flex:1;min-width:0}
  input[type=number],input[type=text],select{
    width:100%;margin-top:4px;padding:7px 9px;background:#0f1319;
    border:1px solid #2c3340;color:#e8eaf0;border-radius:6px;
    font-size:13px;outline:none;font-family:inherit;
  }
  input[type=number]:focus,input[type=text]:focus,select:focus{border-color:#5b8cff}

  .check{display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer;color:#c7ccd8}
  .check input{width:16px;height:16px;accent-color:#5b8cff;margin:0;flex:0 0 auto}

  .radios{display:flex;gap:8px}
  .radios label{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:#0f1319;border:1px solid #2c3340;border-radius:6px;
    padding:8px;cursor:pointer;margin:0;font-size:13px;transition:.15s;
  }
  .radios input{accent-color:#5b8cff;margin:0}
  .radios label:has(input:checked){border-color:#5b8cff;background:#16203a;color:#fff}

  .param{margin-bottom:11px}
  .param .lbl{
    display:flex;justify-content:space-between;align-items:center;
    color:#c7ccd8;margin-bottom:5px;font-size:13px;
  }
  .param .lbl b{
    color:#7fa8ff;font-weight:600;font-size:12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  input[type=range]{
    width:100%;-webkit-appearance:none;appearance:none;
    height:4px;border-radius:2px;background:#2c3340;outline:none;margin:0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#5b8cff;cursor:pointer;border:2px solid #171a21;
  }
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:#5b8cff;
    cursor:pointer;border:2px solid #171a21;
  }

  button{
    width:100%;padding:9px 12px;background:#232a36;border:1px solid #313a49;
    color:#e8eaf0;border-radius:7px;cursor:pointer;font-size:13px;
    font-family:inherit;transition:.15s;
  }
  button:hover{background:#2b3442}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:#3b6fe0;border-color:#3b6fe0;color:#fff;font-weight:600}
  button.primary:hover{background:#4a7cf0}

  .tip{font-size:11px;color:#6f7889;margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.4px}
  .gray-box.dim{opacity:.4}

  .stage{
    flex:1;min-width:0;display:grid;place-items:center;
    overflow:auto;padding:24px;background:#0f1115;
    background-image:
      linear-gradient(45deg,#15181e 25%,transparent 25%),
      linear-gradient(-45deg,#15181e 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#15181e 75%),
      linear-gradient(-45deg,transparent 75%,#15181e 75%);
    background-size:24px 24px;
    background-position:0 0,0 12px,12px -12px,-12px 0;
  }
  #preview{
    max-width:100%;max-height:calc(100vh - 48px);
    image-rendering:pixelated;
    box-shadow:0 10px 40px rgba(0,0,0,.7);
    border-radius:3px;display:none;
  }
  #hint{color:#5d6577;font-size:13px}

  @media (max-width:820px){
    .app{flex-direction:column;height:auto;overflow:visible}
    .panel{width:100%;flex:none;height:auto;border-right:none;border-bottom:1px solid #262b35}
    .stage{min-height:50vh;padding:16px}
    #preview{max-height:60vh}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="panel">
    <h1>图片 → 二色 / 灰阶</h1>

    <div class="drop" id="drop">
      <input type="file" id="file" accept="image/*" hidden>
      点击选择图片，或拖拽 / Ctrl+V 粘贴
    </div>

    <section>
      <h2>尺寸</h2>
      <div class="row">
        <label>宽 <input type="number" id="width" min="1" max="4096" value="256"></label>
        <label>高 <input type="number" id="height" min="1" max="4096" value="256"></label>
      </div>
      <label class="check"><input type="checkbox" id="lockRatio" checked> 锁定宽高比</label>
    </section>

    <!-- ============ 旋转 / 镜像 ============ -->
    <section id="transformSection">
      <h2>旋转 / 镜像</h2>
      <div class="row">
        <label>旋转
          <select id="rotation">
            <option value="0">0°</option>
            <option value="90">90°</option>
            <option value="180">180°</option>
            <option value="270">270°</option>
          </select>
        </label>
        <label style="display:flex;align-items:flex-end;gap:14px;padding-bottom:7px">
          <span class="check" style="margin:0"><input type="checkbox" id="flipH">水平翻转</span>
        </label>
        <label style="display:flex;align-items:flex-end;gap:14px;padding-bottom:7px">
          <span class="check" style="margin:0"><input type="checkbox" id="flipV">垂直翻转</span>
        </label>
      </div>
    </section>

    <section>
      <h2>模式</h2>
      <div class="radios">
        <label><input type="radio" name="mode" value="bw"> 二色</label>
        <label><input type="radio" name="mode" value="gray" checked> 灰阶</label>
      </div>
    </section>

    <!-- ============ 图像参数（两种模式都生效） ============ -->
    <section id="basicSection">
      <h2>图像参数</h2>

      <div class="param">
        <div class="lbl"><span>亮度</span><b id="brVal">0</b></div>
        <input type="range" id="brightness" min="-100" max="100" value="0">
      </div>

      <div class="param">
        <div class="lbl"><span>对比度</span><b id="ctVal">0</b></div>
        <input type="range" id="contrast" min="-100" max="100" value="0">
      </div>

      <div class="param">
        <div class="lbl"><span>伽马</span><b id="gmVal">1.00</b></div>
        <input type="range" id="gamma" min="0.2" max="3" step="0.05" value="1">
      </div>

      <div class="param">
        <div class="lbl"><span>预模糊</span><b id="blVal">0.0</b></div>
        <input type="range" id="blur" min="0" max="8" step="0.5" value="0">
      </div>

      <label>灰度来源
        <select id="graySource">
          <option value="luma709">亮度 Rec.709</option>
          <option value="luma601">亮度 Rec.601</option>
          <option value="avg">平均值</option>
          <option value="max">最大值</option>
          <option value="min">最小值</option>
        </select>
      </label>
    </section>

    <!-- ============ 二色参数（仅二色模式显示） ============ -->
    <section id="bwSection" style="display:none">
      <h2>二色参数</h2>

      <div class="param">
        <div class="lbl"><span>阈值</span><b id="thVal">128</b></div>
        <input type="range" id="threshold" min="0" max="255" value="128">
      </div>

      <label>抖动
        <select id="dither">
          <option value="none">无（纯阈值）</option>
          <option value="bayer2">有序 2×2</option>
          <option value="bayer4">有序 4×4</option>
          <option value="bayer8">有序 8×8</option>
          <option value="floyd">Floyd–Steinberg</option>
          <option value="atkinson">Atkinson</option>
        </select>
      </label>

      <div class="param" style="margin-top:10px">
        <div class="lbl"><span>抖动强度</span><b id="dsVal">100%</b></div>
        <input type="range" id="ditherStrength" min="0" max="200" value="100">
      </div>

      <label class="check"><input type="checkbox" id="invert"> 反相（黑底白图）</label>

      <button id="resetAll" style="margin-top:6px">重置全部参数</button>
    </section>

    <!-- ============ 后处理（两种模式都可应用） ============ -->
    <section id="postSection">
      <h2>后处理</h2>
      <div class="gray-box" id="grayBox">
        <label class="check"><input type="checkbox" id="glow"> 发光（R≠00 的像素 R=E0，否则 R=FF）</label>

        <div class="row">
          <label>主题
            <select id="theme">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </label>
          <label>模型高度 B <input type="number" id="bval" min="0" max="255" value="0"></label>
        </div>
        <div class="tip" id="themeTip"></div>

        <label class="check" style="margin-top:12px"><input type="checkbox" id="half"> 半格</label>

        <button class="primary" id="applyBtn" style="margin-top:6px">应用后处理</button>
      </div>
    </section>

    <!-- ============ 输出设置 ============ -->
    <section id="outputSection">
      <h2>输出设置</h2>
      <div class="row">
        <label>关卡名 <input type="text" id="levelName" value="level" maxlength="64"></label>
        <label>层数 <input type="number" id="levelNum" min="0" max="9999" value="0"></label>
      </div>
      <label>输出方式
        <select id="outMode">
          <option value="single">单张</option>
          <option value="layers">分层</option>
          <option value="vertical">竖直模式</option>
        </select>
      </label>
      <div class="tip">文件名：关卡名.层数.png</div>
    </section>

    <!-- ============ 分层选项 ============ -->
    <section id="layerSection" style="display:none">
      <h2>分层选项</h2>
      <div class="row">
        <label>分层数 <input type="number" id="layerCount" min="2" max="256" value="4"></label>
        <label>方向
          <select id="layerDir">
            <option value="x">X 方向</option>
            <option value="y">Y 方向</option>
            <option value="xy">XY 斜向</option>
          </select>
        </label>
      </div>
      <div class="param" id="layerAngleWrap" style="display:none;margin-top:10px">
        <div class="lbl"><span>切分角度</span><b id="laVal">45°</b></div>
        <input type="range" id="layerAngle" min="0" max="180" value="45">
      </div>
      <div class="tip">第 N-1 层放坐标最小的部分，依次递减到第 0 层</div>
    </section>

    <!-- ============ 竖直选项 ============ -->
    <section id="vertSection" style="display:none">
      <h2>竖直模式</h2>
      <div class="row">
        <label>方向
          <select id="vertDir">
            <option value="x">X 轴 → Z</option>
            <option value="y">Y 轴 → Z</option>
            <option value="xy">XY 轴 → Z</option>
          </select>
        </label>
        <label>尺寸
          <select id="vertSize">
            <option value="auto">自动</option>
            <option value="orig">保留原尺寸</option>
          </select>
        </label>
      </div>
      <div class="row" id="vertPosWrap" style="display:none;margin-top:8px">
        <label>X 坐标 <input type="number" id="vertPosX" min="0" max="4095" value="0"></label>
        <label>Y 坐标 <input type="number" id="vertPosY" min="0" max="4095" value="0"></label>
      </div>
      <div class="tip">X 方向：每层是 1×H 切片；保留原尺寸时放在指定 X 列</div>
    </section>

    <section>
      <button class="primary" id="exportBtn">导出 PNG</button>
      <button id="exportZipBtn" style="margin-top:8px">导出 ZIP</button>
    </section>
  </aside>

  <main class="stage">
    <canvas id="preview"></canvas>
    <div id="hint">先载入一张图片</div>
  </main>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);

  const canvas = $('preview');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  /* ---------------- 常量表 ---------------- */

  const THEME_TABLE = [
    [0xff, 0xbf, 0x7f, 0x3f],
    [0xbf, 0xff, 0x7f, 0x3f],
    [0xbf, 0x7f, 0xff, 0x3f],
    [0xbf, 0x7f, 0x3f, 0xff],
  ];

  const BAYER2 = [0, 2, 3, 1];
  const BAYER4 = [
     0,  8,  2, 10,
    12,  4, 14,  6,
     3, 11,  1,  9,
    15,  7, 13,  5
  ];
  const BAYER8 = [
     0, 32,  8, 40,  2, 34, 10, 42,
    48, 16, 56, 24, 50, 18, 58, 26,
    12, 44,  4, 36, 14, 46,  6, 38,
    60, 28, 52, 20, 62, 30, 54, 22,
     3, 35, 11, 43,  1, 33,  9, 41,
    51, 19, 59, 27, 49, 17, 57, 25,
    15, 47,  7, 39, 13, 45,  5, 37,
    63, 31, 55, 23, 61, 29, 53, 21
  ];

  const FS_KERNEL = [
    [ 1, 0, 7 / 16],
    [-1, 1, 3 / 16],
    [ 0, 1, 5 / 16],
    [ 1, 1, 1 / 16]
  ];
  const ATK_KERNEL = [
    [ 1, 0, 1 / 8],
    [ 2, 0, 1 / 8],
    [-1, 1, 1 / 8],
    [ 0, 1, 1 / 8],
    [ 1, 1, 1 / 8],
    [ 0, 2, 1 / 8]
  ];

  let img = null;
  let aspect = 1;
  let baseData = null;
  let processedData = null;
  let _rotCache = null;
  let _rotCacheKey = '';
  let prevRotation = 0;

  /* ---------------- 工具函数 ---------------- */

  const getMode = () => document.querySelector('input[name="mode"]:checked').value;

  function readInt(el, min, max, fallback) {
    const v = parseInt(el.value, 10);
    if (Number.isNaN(v)) return fallback;
    return Math.max(min, Math.min(max, v));
  }

  function updateThemeTip() {
    const t = THEME_TABLE[readInt($('theme'), 0, 3, 0)];
    $('themeTip').textContent = '亮→暗：' +
      t.map(v => v.toString(16).padStart(2, '0').toUpperCase()).join(' / ');
  }

  function updateModeUI() {
    const isGray = getMode() === 'gray';
    $('bwSection').style.display = isGray ? 'none' : 'block';
  }

  function updateOutputUI() {
    const m = $('outMode').value;
    $('layerSection').style.display = m === 'layers' ? 'block' : 'none';
    $('vertSection').style.display = m === 'vertical' ? 'block' : 'none';
    $('layerAngleWrap').style.display = $('layerDir').value === 'xy' ? 'block' : 'none';
    $('vertPosWrap').style.display = $('vertSize').value === 'orig' ? 'block' : 'none';
  }

  /* ---------------- 旋转 / 镜像 ---------------- */

  function getRotatedCanvas() {
    const rot = +$('rotation').value;
    const fh = $('flipH').checked;
    const fv = $('flipV').checked;
    //const key = `${rot}|${fh}|${fv}|${img ? (img.src || '').slice(-60) : ''}`;
    const key = `${rot}|${fh}|${fv}|${img ? (img.__id || (img.__id = Math.random())) : ''}`;
    if (_rotCache && _rotCacheKey === key) return _rotCache;

    if (rot === 0 && !fh && !fv) {
      _rotCache = { canvas: img, w: img.naturalWidth, h: img.naturalHeight };
    } else {
      const swap = (rot === 90 || rot === 270);
      const rw = swap ? img.naturalHeight : img.naturalWidth;
      const rh = swap ? img.naturalWidth : img.naturalHeight;
      const c = document.createElement('canvas');
      c.width = rw; c.height = rh;
      const cx = c.getContext('2d');
      cx.translate(rw / 2, rh / 2);
      cx.rotate(rot * Math.PI / 180);
      cx.scale(fh ? -1 : 1, fv ? -1 : 1);
      cx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
      _rotCache = { canvas: c, w: rw, h: rh };
    }
    _rotCacheKey = key;
    return _rotCache;
  }

  /* ---------------- 滑块数值显示 ---------------- */

  const RANGES = [
    ['brightness',     'brVal', v => (v > 0 ? '+' : '') + v],
    ['contrast',       'ctVal', v => (v > 0 ? '+' : '') + v],
    ['gamma',          'gmVal', v => (+v).toFixed(2)],
    ['blur',           'blVal', v => (+v).toFixed(1)],
    ['threshold',      'thVal', v => v],
    ['ditherStrength', 'dsVal', v => v + '%'],
    ['layerAngle',     'laVal', v => v + '°'],
  ];

  function syncRangeLabels() {
    for (const [id, outId, fmt] of RANGES) {
      if ($(id)) $(outId).textContent = fmt($(id).value);
    }
  }

  /* ---------------- 载入图片 ---------------- */

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      img = image;
      _rotCache = null; _rotCacheKey = '';
      const r = getRotatedCanvas();
      aspect = r.w / r.h;

      let w = r.w, h = r.h;
      const MAX = 1024;
      if (Math.max(w, h) > MAX) {
        const s = MAX / Math.max(w, h);
        w = Math.max(1, Math.round(w * s));
        h = Math.max(1, Math.round(h * s));
      }
      $('width').value = w;
      $('height').value = h;
      prevRotation = +$('rotation').value;

      $('hint').style.display = 'none';
      canvas.style.display = 'block';
      rebuild();
      URL.revokeObjectURL(url);
    };
    image.onerror = () => alert('图片加载失败');
    image.src = url;
  }

  $('drop').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
  });

  ['dragenter', 'dragover'].forEach(ev =>
    $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); })
  );
  ['dragleave', 'drop'].forEach(ev =>
    $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); })
  );
  $('drop').addEventListener('drop', e => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
  window.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const it of items) {
      if (it.type.startsWith('image/')) { loadFile(it.getAsFile()); break; }
    }
  });

  /* ---------------- 处理核心 ---------------- */

  function graySource(r, g, b) {
    switch ($('graySource').value) {
      case 'luma709': return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      case 'luma601': return 0.299  * r + 0.587  * g + 0.114  * b;
      case 'avg':     return (r + g + b) / 3;
      case 'max':     return Math.max(r, g, b);
      case 'min':     return Math.min(r, g, b);
    }
    return 0.299 * r + 0.587 * g + 0.114 * b;
  }

  function buildLUT() {
    const b = +$('brightness').value;
    const c = +$('contrast').value;
    const g = +$('gamma').value;
    const f = (c + 100) / 100;
    const lut = new Uint8ClampedArray(256);
    for (let i = 0; i < 256; i++) {
      let v = i + b;
      v = (v - 128) * f + 128;
      if (v < 0) v = 0; else if (v > 255) v = 255;
      if (g !== 1) v = 255 * Math.pow(v / 255, 1 / g);
      lut[i] = v;
    }
    return lut;
  }

  function simpleThreshold(gray, w, h, thr) {
    const bin = new Uint8Array(w * h);
    for (let p = 0; p < w * h; p++) bin[p] = gray[p] > thr ? 1 : 0;
    return bin;
  }

  function orderedDither(gray, w, h, mat, n, strength, thr) {
    const bin = new Uint8Array(w * h);
    const size = n * n;
    for (let y = 0; y < h; y++) {
      const my = (y % n) * n;
      for (let x = 0; x < w; x++) {
        const p = y * w + x;
        const t = (mat[my + (x % n)] + 0.5) / size;
        const offset = (t - 0.5) * 255 * strength;
        bin[p] = (gray[p] + offset) > thr ? 1 : 0;
      }
    }
    return bin;
  }

  function errorDither(gray, w, h, kernel, strength, thr) {
    const buf = Float32Array.from(gray);
    const bin = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const p = y * w + x;
        const old = buf[p];
        const nv = old > thr ? 255 : 0;
        bin[p] = nv ? 1 : 0;
        const err = (old - nv) * strength;
        if (err === 0) continue;
        for (let k = 0; k < kernel.length; k++) {
          const dx = kernel[k][0], dy = kernel[k][1], wt = kernel[k][2];
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < w && ny < h) buf[ny * w + nx] += err * wt;
        }
      }
    }
    return bin;
  }

  /* ---------------- 生成基础图 ---------------- */

  function rebuild() {
    if (!img) return;

    const rotated = getRotatedCanvas();
    aspect = rotated.w / rotated.h;

    const w = readInt($('width'), 1, 4096, 1);
    const h = readInt($('height'), 1, 4096, 1);
    const mode = getMode();

    const tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    const tctx = tmp.getContext('2d', { willReadFrequently: true });

    tctx.fillStyle = '#ffffff';
    tctx.fillRect(0, 0, w, h);

    const blur = parseFloat($('blur').value) || 0;
    if (blur > 0) tctx.filter = `blur(${blur}px)`;

    tctx.imageSmoothingEnabled = true;
    tctx.imageSmoothingQuality = 'high';
    tctx.drawImage(rotated.canvas, 0, 0, w, h);
    tctx.filter = 'none';

    const src = tctx.getImageData(0, 0, w, h).data;
    const out = new ImageData(w, h);
    const N = w * h;

    const lut = buildLUT();
    const gray = new Float32Array(N);
    for (let p = 0, i = 0; p < N; p++, i += 4) {
      let v = graySource(src[i], src[i + 1], src[i + 2]);
      let idx = Math.round(v);
      if (idx < 0) idx = 0; else if (idx > 255) idx = 255;
      gray[p] = lut[idx];
    }

    if (mode === 'gray') {
      for (let p = 0, i = 0; p < N; p++, i += 4) {
        const v = Math.round(gray[p]);
        out.data[i] = out.data[i + 1] = out.data[i + 2] = v;
        out.data[i + 3] = 255;
      }
    } else {
      const thr = +$('threshold').value;
      const strength = +$('ditherStrength').value / 100;
      const d = $('dither').value;

      let bin;
      if      (d === 'bayer2')   bin = orderedDither(gray, w, h, BAYER2, 2, strength, thr);
      else if (d === 'bayer4')   bin = orderedDither(gray, w, h, BAYER4, 4, strength, thr);
      else if (d === 'bayer8')   bin = orderedDither(gray, w, h, BAYER8, 8, strength, thr);
      else if (d === 'floyd')    bin = errorDither(gray, w, h, FS_KERNEL,  strength, thr);
      else if (d === 'atkinson') bin = errorDither(gray, w, h, ATK_KERNEL, strength, thr);
      else                       bin = simpleThreshold(gray, w, h, thr);

      const inv = $('invert').checked;
      for (let p = 0, i = 0; p < N; p++, i += 4) {
        let v = bin[p] ? 255 : 0;
        if (inv) v = 255 - v;
        out.data[i] = out.data[i + 1] = out.data[i + 2] = v;
        out.data[i + 3] = 255;
      }
    }

    baseData = out;
    processedData = null;
    show();
  }

  let rebuildTimer = null;
  function scheduleRebuild() {
    clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(rebuild, 120);
  }

  /* ---------------- 显示 ---------------- */

  function currentData() {
    if (processedData) return processedData;
    return baseData;
  }

  function show() {
    const data = currentData();
    if (!data) return;
    if (canvas.width !== data.width || canvas.height !== data.height) {
      canvas.width = data.width;
      canvas.height = data.height;
    }
    ctx.putImageData(data, 0, 0);
  }

  /* ---------------- 后处理 ---------------- */

  function applyPost() {
    if (!baseData) { alert('请先载入一张图片'); return; }

    const w = baseData.width, h = baseData.height;
    const src = baseData.data;
    const out = new ImageData(w, h);

    const glow  = $('glow').checked;
    const theme = readInt($('theme'), 0, 3, 0);
    const bVal  = readInt($('bval'), 0, 255, 0);
    const half  = $('half').checked;
    const gTab  = THEME_TABLE[theme];

    for (let i = 0; i < src.length; i += 4) {
      const luma = src[i];

      let R = (luma !== 0) ? (glow ? 0xe0 : 0xff) : 0x00;

      let lv;
      if (luma >= 192)      lv = 0;
      else if (luma >= 128) lv = 1;
      else if (luma >= 64)  lv = 2;
      else                  lv = 3;
      const G = gTab[lv];

      let B = bVal;

      if (half) {
        if (R === 0xff) {
          B = 0x80;
        } else if (R !== 0x00) {
          R = 0xc0;
        }
      }

      out.data[i]     = R;
      out.data[i + 1] = G;
      out.data[i + 2] = B;
      out.data[i + 3] = 255;
    }

    processedData = out;
    show();
  }

  /* ---------------- 分层 ---------------- */

  function splitInto(data, n, dir, angleDeg) {
    const w = data.width, h = data.height;
    const src = data.data;
    const outs = [];
    for (let i = 0; i < n; i++) {
      const od = new ImageData(w, h);
      // 黑底 0x000000 不透明
      for (let p = 0; p < w * h; p++) od.data[p * 4 + 3] = 255;
      outs.push(od);
    }

    if (dir === 'x' || dir === 'y') {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let part;
          if (dir === 'x') {
            part = Math.floor(x * n / w);
          } else {
            part = Math.floor(y * n / h);
          }
          if (part < 0) part = 0;
          if (part >= n) part = n - 1;
          const layer = n - 1 - part;

          const pi = (y * w + x) * 4;
          const oi = (y * w + x) * 4;
          const od = outs[layer].data;
          od[oi]     = src[pi];
          od[oi + 1] = src[pi + 1];
          od[oi + 2] = src[pi + 2];
        }
      }
    } else {
      // XY 斜向
      const a = angleDeg * Math.PI / 180;
      const ca = Math.cos(a), sa = Math.sin(a);
      let minP = Infinity, maxP = -Infinity;
      const corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]];
      for (const [x, y] of corners) {
        const p = x * ca + y * sa;
        if (p < minP) minP = p;
        if (p > maxP) maxP = p;
      }
      const range = (maxP - minP) || 1;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const proj = x * ca + y * sa;
          let part = Math.floor((proj - minP) / range * n);
          if (part < 0) part = 0;
          if (part >= n) part = n - 1;
          const layer = n - 1 - part;

          const pi = (y * w + x) * 4;
          const oi = (y * w + x) * 4;
          const od = outs[layer].data;
          od[oi]     = src[pi];
          od[oi + 1] = src[pi + 1];
          od[oi + 2] = src[pi + 2];
        }
      }
    }
    return outs;
  }

  /* ---------------- 竖直模式 ---------------- */

  function blackImage(iw, ih) {
    const od = new ImageData(iw, ih);
    for (let p = 0; p < iw * ih; p++) od.data[p * 4 + 3] = 255;
    return od;
  }

  function extrude(data, dir, sizeMode, posX, posY) {
    const w = data.width, h = data.height;
    const src = data.data;
    const outs = [];

    if (dir === 'x') {
      for (let k = 0; k < w; k++) {
        if (sizeMode === 'auto') {
          const od = new ImageData(1, h);
          for (let y = 0; y < h; y++) {
            const si = (y * w + k) * 4;
            const oi = y * 4;
            od.data[oi]     = src[si];
            od.data[oi + 1] = src[si + 1];
            od.data[oi + 2] = src[si + 2];
            od.data[oi + 3] = 255;
          }
          outs.push(od);
        } else {
          const od = blackImage(w, h);
          const px = Math.max(0, Math.min(w - 1, posX));
          for (let y = 0; y < h; y++) {
            const si = (y * w + k) * 4;
            const oi = (y * w + px) * 4;
            od.data[oi]     = src[si];
            od.data[oi + 1] = src[si + 1];
            od.data[oi + 2] = src[si + 2];
          }
          outs.push(od);
        }
      }
    } else if (dir === 'y') {
      for (let k = 0; k < h; k++) {
        if (sizeMode === 'auto') {
          const od = new ImageData(w, 1);
          for (let x = 0; x < w; x++) {
            const si = (k * w + x) * 4;
            const oi = x * 4;
            od.data[oi]     = src[si];
            od.data[oi + 1] = src[si + 1];
            od.data[oi + 2] = src[si + 2];
            od.data[oi + 3] = 255;
          }
          outs.push(od);
        } else {
          const od = blackImage(w, h);
          const py = Math.max(0, Math.min(h - 1, posY));
          for (let x = 0; x < w; x++) {
            const si = (k * w + x) * 4;
            const oi = (py * w + x) * 4;
            od.data[oi]     = src[si];
            od.data[oi + 1] = src[si + 1];
            od.data[oi + 2] = src[si + 2];
          }
          outs.push(od);
        }
      }
    } else {
      // XY 斜向：沿对角线 x+y = k 切片
      const n = w + h - 1;
      for (let k = 0; k < n; k++) {
        const od = blackImage(w, h);
        const x0 = Math.max(0, k - h + 1);
        const x1 = Math.min(w - 1, k);
        for (let x = x0; x <= x1; x++) {
          const y = k - x;
          const si = (y * w + x) * 4;
          const oi = (y * w + x) * 4;
          od.data[oi]     = src[si];
          od.data[oi + 1] = src[si + 1];
          od.data[oi + 2] = src[si + 2];
        }
        outs.push(od);
      }
    }
    return outs;
  }

  /* ---------------- 导出：工具 ---------------- */

  function makeBlob(data) {
    return new Promise(resolve => {
      const c = document.createElement('canvas');
      c.width = data.width;
      c.height = data.height;
      c.getContext('2d').putImageData(data, 0, 0);
      c.toBlob(blob => resolve(blob), 'image/png');
    });
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  function safeName(s) {
    return (s || 'level').replace(/[\\/:*?"<>|]/g, '_').slice(0, 64) || 'level';
  }

  /* ---------------- 导出：收集所有输出 ---------------- */

  // 返回 [{ filename, data }]，或 null（无图）
  function gatherOutputs() {
    const data = currentData();
    if (!data) return null;

    const levelName = safeName($('levelName').value.trim());
    const outMode = $('outMode').value;
    const list = [];

    if (outMode === 'single') {
      const num = readInt($('levelNum'), 0, 9999, 0);
      list.push({ filename: `${levelName}.${num}.png`, data });
    } else if (outMode === 'layers') {
      const n = readInt($('layerCount'), 2, 256, 4);
      const dir = $('layerDir').value;
      const angle = +$('layerAngle').value;
      const outs = splitInto(data, n, dir, angle);
      for (let i = 0; i < outs.length; i++) {
        list.push({ filename: `${levelName}.${i}.png`, data: outs[i] });
      }
    } else { // vertical
      const dir = $('vertDir').value;
      const sizeMode = $('vertSize').value;
      const px = readInt($('vertPosX'), 0, 4095, 0);
      const py = readInt($('vertPosY'), 0, 4095, 0);
      const outs = extrude(data, dir, sizeMode, px, py);
      for (let i = 0; i < outs.length; i++) {
        list.push({ filename: `${levelName}.${i}.png`, data: outs[i] });
      }
    }
    return list;
  }

  /* ---------------- 导出：逐张 ---------------- */

  async function doExport() {
    const list = gatherOutputs();
    if (!list) { alert('请先载入一张图片'); return; }

    const btn = $('exportBtn');
    btn.disabled = true;
    const oldText = btn.textContent;

    try {
      for (let i = 0; i < list.length; i++) {
        btn.textContent = `导出中… ${i + 1}/${list.length}`;
        const blob = await makeBlob(list[i].data);
        triggerDownload(blob, list[i].filename);
        await new Promise(r => setTimeout(r, 120));
      }
    } finally {
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  /* ---------------- 导出：ZIP ---------------- */

  async function doExportZip() {
    const list = gatherOutputs();
    if (!list) { alert('请先载入一张图片'); return; }

    const btn = $('exportZipBtn');
    btn.disabled = true;
    const oldText = btn.textContent;

    try {
      const zip = new JSZip();

      for (let i = 0; i < list.length; i++) {
        btn.textContent = `打包中… ${i + 1}/${list.length}`;
        const blob = await makeBlob(list[i].data);
        zip.file(list[i].filename, blob);
        // 让 UI 有机会刷新
        if (i % 4 === 0) await new Promise(r => setTimeout(r, 0));
      }

      btn.textContent = '生成 ZIP…';
      const zipBlob = await zip.generateAsync({
        type: 'blob',
        compression: 'DEFLATE',
        compressionOptions: { level: 6 }
      });

      const levelName = safeName($('levelName').value.trim());
      triggerDownload(zipBlob, `${levelName}.zip`);
    } finally {
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  /* ---------------- 事件绑定 ---------------- */

  $('width').addEventListener('input', () => {
    if ($('lockRatio').checked && img && aspect > 0) {
      const w = readInt($('width'), 1, 4096, 1);
      $('height').value = Math.max(1, Math.round(w / aspect));
    }
    scheduleRebuild();
  });

  $('height').addEventListener('input', () => {
    if ($('lockRatio').checked && img && aspect > 0) {
      const h = readInt($('height'), 1, 4096, 1);
      $('width').value = Math.max(1, Math.round(h * aspect));
    }
    scheduleRebuild();
  });

  $('lockRatio').addEventListener('change', () => {
    if ($('lockRatio').checked && img) {
      const w = readInt($('width'), 1, 4096, 1);
      const h = readInt($('height'), 1, 4096, 1);
      if (h > 0) aspect = w / h;
    }
  });

  // 旋转：跨 90°/270° 边界时互换宽高
  $('rotation').addEventListener('change', () => {
    if (!img) return;

    const newRot = +$('rotation').value;
    const wasSwap = (prevRotation === 90 || prevRotation === 270);
    const isSwap  = (newRot === 90 || newRot === 270);
    prevRotation = newRot;

    const r = getRotatedCanvas();
    aspect = r.w / r.h;

    // 只有"是否互换"状态发生变化时才交换宽高
    if (wasSwap !== isSwap) {
      const w = readInt($('width'),  1, 4096, 1);
      const h = readInt($('height'), 1, 4096, 1);
      $('width').value  = h;
      $('height').value = w;
    }

    rebuild();
  });

  // 翻转：不改变长宽，只重绘
  ['flipH', 'flipV'].forEach(id => {
    $(id).addEventListener('change', () => {
      if (!img) return;
      const r = getRotatedCanvas();
      aspect = r.w / r.h;
      rebuild();
    });
  });

  document.querySelectorAll('input[name="mode"]').forEach(el => {
    el.addEventListener('change', () => {
      updateModeUI();
      rebuild();
    });
  });

  ['brightness', 'contrast', 'gamma', 'blur'].forEach(id => {
    $(id).addEventListener('input', () => {
      const item = RANGES.find(r => r[0] === id);
      $(item[1]).textContent = item[2]($(id).value);
      scheduleRebuild();
    });
  });
  $('graySource').addEventListener('change', rebuild);

  $('threshold').addEventListener('input', () => {
    $('thVal').textContent = $('threshold').value;
    scheduleRebuild();
  });
  $('ditherStrength').addEventListener('input', () => {
    $('dsVal').textContent = $('ditherStrength').value + '%';
    scheduleRebuild();
  });
  $('dither').addEventListener('change', rebuild);
  $('invert').addEventListener('change', rebuild);

  $('resetAll').addEventListener('click', () => {
    $('brightness').value = 0;
    $('contrast').value = 0;
    $('gamma').value = 1;
    $('blur').value = 0;
    $('graySource').value = 'luma709';
    $('threshold').value = 128;
    $('dither').value = 'none';
    $('ditherStrength').value = 100;
    $('invert').checked = false;
    syncRangeLabels();
    rebuild();
  });

  $('applyBtn').addEventListener('click', applyPost);
  $('exportBtn').addEventListener('click', doExport);
  $('exportZipBtn').addEventListener('click', doExportZip);

  $('theme').addEventListener('change', updateThemeTip);
  $('bval').addEventListener('input', () => {
    const v = readInt($('bval'), 0, 255, 0);
    if (String(v) !== $('bval').value && $('bval').value !== '') $('bval').value = v;
  });

  // 输出设置
  $('outMode').addEventListener('change', updateOutputUI);
  $('layerDir').addEventListener('change', updateOutputUI);
  $('vertSize').addEventListener('change', updateOutputUI);
  $('layerAngle').addEventListener('input', () => {
    $('laVal').textContent = $('layerAngle').value + '°';
  });

  /* ---------------- 初始化 ---------------- */
  syncRangeLabels();
  updateThemeTip();
  updateModeUI();
  updateOutputUI();
})();
</script>
</body>
</html>
