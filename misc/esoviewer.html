<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>EDGE 模型与贴图查看器</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 320px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; z-index: 10; }
        #sidebar-header { padding: 15px; background: #252526; border-bottom: 1px solid #333; }
        #drop-zone { border: 2px dashed #555; padding: 20px; text-align: center; cursor: pointer; border-radius: 5px; margin-top: 10px; color: #aaa; }
        #drop-zone.dragover { background: rgba(255,255,255,0.1); border-color: #0078d7; color: white; }
        #tree-container { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        .tree-node { margin: 4px 0; cursor: pointer; user-select: none; padding: 2px 0; }
        .tree-node:hover { background: #2a2d2e; }
        .tree-children { margin-left: 16px; border-left: 1px dotted #444; padding-left: 8px; display: none; }
        .tree-children.open { display: block; }
        .tree-icon { display: inline-block; width: 16px; text-align: center; margin-right: 4px; font-size: 10px; }
        .material-panel { padding: 8px 6px; background: #2a2a2a; border-radius: 4px; margin: 4px 0 6px 0; display: flex; flex-direction: column; gap: 6px; }
        .material-panel button { padding: 5px; font-size: 12px; }
        .material-panel .preset-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .material-panel .preset-row button { padding: 6px 0; }
        .material-panel .color-row { display: flex; gap: 4px; align-items: center; }
        .material-panel input[type="color"] { flex: 1; height: 28px; padding: 0; border: none; cursor: pointer; }
        .material-panel .clear-btn { background: #555; font-size: 11px; }
        .material-panel .clear-btn:hover { background: #666; }
        #controls { padding: 15px; background: #252526; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .control-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
        button { padding: 8px; background: #0e639c; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #1177bb; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #viewport { flex: 1; position: relative; }
        #info { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; font-size: 12px; pointer-events: none; color: #ccc; }
        input[type="file"] { display: none; }
        #modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        #modal-content { background: #2d2d2d; padding: 20px; border-radius: 8px; max-width: 600px; width: 80%; max-height: 80vh; overflow-y: auto; }
        #xml-output { width: 100%; height: 300px; background: #111; color: #0f0; border: 1px solid #444; font-family: monospace; }
    </style>

            loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js')
                .catch(function (e) { console.error(e); })
                .then(function () {
                    if (typeof THREE.OrbitControls === 'undefined') {
                        return loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');
                    }
                })
                .catch(function (e) { console.error(e); });
        } else if (typeof THREE.OrbitControls === 'undefined') {
            loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js')
                .catch(function (e) { console.error(e); });
        }
    })();

    // ================= 主程序（全局 THREE） =================
    function main() {

        // ================= 状态管理 =================
        let scene, camera, renderer, controls;
        let currentObject = null;
        let axesHelper = null;

        const filePool = new Map();          // name -> { file, buffer, url }
        let currentESOData = null;
        const materialTextures = new Map();  // matHash -> THREE.Texture
        const materialColors = new Map();    // matHash -> 0xRRGGBB
        const materialNodes = new Map();     // matHash -> treeNode（用于更新状态）

        // ================= 初始化 =================
        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(
                60,
                document.getElementById('viewport').clientWidth / window.innerHeight,
                0.1,
                20000
            );
            camera.position.set(0, 50, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(document.getElementById('viewport').clientWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('viewport').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            axesHelper = new THREE.AxesHelper(50);
            scene.add(axesHelper);

            window.addEventListener('resize', () => {
                camera.aspect = document.getElementById('viewport').clientWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(document.getElementById('viewport').clientWidth, window.innerHeight);
            });

            let lastTime = performance.now();
            let frames = 0;
            (function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
                frames++;
                const now = performance.now();
                if (now - lastTime >= 1000) {
                    document.getElementById('fps').innerText = frames;
                    frames = 0;
                    lastTime = now;
                }
            })();
        }

        // ================= ESO 解析器 =================
        function parseESO(buffer) {
            const view = new DataView(buffer);
            let pos = 0;
            const decoder = new TextDecoder();

            pos += 8;
            const origName = decoder.decode(new Uint8Array(buffer, pos, 64)).replace(/\0/g, ''); pos += 64;
            pos += 64; // ns

            const v01 = view.getInt32(pos, true); pos += 4;
            const v02 = view.getInt32(pos, true); pos += 4;
            const hash1 = view.getBigUint64(pos, true).toString(16).toUpperCase().padStart(16, '0'); pos += 8;
            const hash2 = view.getBigUint64(pos, true).toString(16).toUpperCase().padStart(16, '0'); pos += 8;
            const v07 = view.getInt32(pos, true); pos += 4;
            const v08 = view.getInt32(pos, true); pos += 4;
            const v09 = view.getInt32(pos, true); pos += 4;
            const scaleXYZ = view.getFloat32(pos, true); pos += 4;

            const translate = [view.getFloat32(pos, true), view.getFloat32(pos + 4, true), view.getFloat32(pos + 8, true)]; pos += 12;
            const rotate    = [view.getFloat32(pos, true), view.getFloat32(pos + 4, true), view.getFloat32(pos + 8, true)]; pos += 12;
            const scale     = [view.getFloat32(pos, true), view.getFloat32(pos + 4, true), view.getFloat32(pos + 8, true)]; pos += 12;

            const v20 = view.getFloat32(pos, true); pos += 4;
            const v21 = view.getInt32(pos, true); pos += 4;
            const modelCount = view.getInt32(pos, true); pos += 4;

            let bMin = [0, 0, 0], bMax = [0, 0, 0];
            if (modelCount > 0) {
                bMin = [view.getFloat32(pos, true), view.getFloat32(pos + 4, true), view.getFloat32(pos + 8, true)]; pos += 12;
                bMax = [view.getFloat32(pos, true), view.getFloat32(pos + 4, true), view.getFloat32(pos + 8, true)]; pos += 12;
            }

            const models = [];
            for (let m = 0; m < modelCount; m++) {
                const matHash = view.getBigUint64(pos, true).toString(16).toUpperCase().padStart(16, '0'); pos += 8;
                const flags = view.getUint32(pos, true); pos += 4;
                const numVerts = view.getInt32(pos, true); pos += 4;
                pos += 4; // numPolys
                pos += 4;

                const hasNormal = (flags & 1) !== 0;
                const hasColor = (flags & 2) !== 0;
                const hasTexCoord = (flags & 4) !== 0;
                const hasTexCoord2 = (flags & 8) !== 0;

                const positions = new Float32Array(numVerts * 3);
                for (let i = 0; i < numVerts; i++) {
                    positions[i * 3]     = view.getFloat32(pos, true);
                    positions[i * 3 + 1] = view.getFloat32(pos + 4, true);
                    positions[i * 3 + 2] = view.getFloat32(pos + 8, true);
                    pos += 12;
                }
                let normals = null;
                if (hasNormal) {
                    normals = new Float32Array(numVerts * 3);
                    for (let i = 0; i < numVerts; i++) {
                        normals[i * 3]     = view.getFloat32(pos, true);
                        normals[i * 3 + 1] = view.getFloat32(pos + 4, true);
                        normals[i * 3 + 2] = view.getFloat32(pos + 8, true);
                        pos += 12;
                    }
                }
                let colors = null;
                if (hasColor) {
                    colors = new Float32Array(numVerts * 3);
                    for (let i = 0; i < numVerts; i++) {
                        const c = view.getUint32(pos, true); pos += 4;
                        colors[i * 3]     = ((c >> 16) & 0xFF) / 255;
                        colors[i * 3 + 1] = ((c >> 8) & 0xFF) / 255;
                        colors[i * 3 + 2] = (c & 0xFF) / 255;
                    }
                }
                let uvs = null;
                if (hasTexCoord) {
                    uvs = new Float32Array(numVerts * 2);
                    for (let i = 0; i < numVerts; i++) {
                        uvs[i * 2]     = view.getFloat32(pos, true);
                        uvs[i * 2 + 1] = view.getFloat32(pos + 4, true);
                        pos += 8;
                    }
                }
                if (hasTexCoord2) pos += numVerts * 8;

                const indices = new Uint16Array(numVerts);
                for (let i = 0; i < numVerts; i++) {
                    indices[i] = view.getUint16(pos, true); pos += 2;
                }

                models.push({ matHash, positions, normals, colors, uvs, indices });
            }

            return {
                filename: origName, v01, v02, hash1, hash2, v07, v08, v09, scaleXYZ,
                translate, rotate, scale, v20, v21, bMin, bMax, models
            };
        }

        // ================= 渲染模型 =================
        function renderESO(esoData) {
            if (currentObject) {
                scene.remove(currentObject);
                currentObject.traverse((child) => {
                    if (child.isMesh) child.geometry.dispose();
                });
            }

            const group = new THREE.Group();
            group.scale.set(
                esoData.scale[0] * esoData.scaleXYZ,
                esoData.scale[1] * esoData.scaleXYZ,
                esoData.scale[2] * esoData.scaleXYZ
            );
            group.position.set(esoData.translate[0], esoData.translate[1], esoData.translate[2]);

            let totalTris = 0;

            esoData.models.forEach(model => {
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(model.positions, 3));
                if (model.normals) geometry.setAttribute('normal', new THREE.BufferAttribute(model.normals, 3));
                if (model.colors)  geometry.setAttribute('color', new THREE.BufferAttribute(model.colors, 3));
                if (model.uvs)     geometry.setAttribute('uv', new THREE.BufferAttribute(model.uvs, 2));
                geometry.setIndex(new THREE.BufferAttribute(model.indices, 1));

                totalTris += model.indices.length / 3;

                const mat = new THREE.MeshBasicMaterial({
                    side: THREE.DoubleSide,
                    wireframe: document.getElementById('wireframe').checked,
                    vertexColors: !!model.colors
                });

                if (materialTextures.has(model.matHash)) {
                    mat.map = materialTextures.get(model.matHash);
                    mat.color.setHex(0xffffff);
                    mat.vertexColors = false;
                } else if (materialColors.has(model.matHash)) {
                    mat.color.set(materialColors.get(model.matHash));
                }

                const mesh = new THREE.Mesh(geometry, mat);
                mesh.userData.matHash = model.matHash;
                group.add(mesh);
            });

            currentObject = group;
            scene.add(group);
            document.getElementById('tri-count').innerText = totalTris;

            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);

            camera.position.copy(center);
            camera.position.z += maxDim * 1.5;
            controls.target.copy(center);
            controls.update();

            document.getElementById('bbox-info').innerText =
                `Min: ${box.min.x.toFixed(1)}, ${box.min.y.toFixed(1)}, ${box.min.z.toFixed(1)} | ` +
                `Max: ${box.max.x.toFixed(1)}, ${box.max.y.toFixed(1)}, ${box.max.z.toFixed(1)}`;

            buildTreeUI(esoData);
            document.getElementById('btn-export-xml').disabled = false;
            document.getElementById('btn-compile-eso').disabled = false;
        }

        // ================= 模型树 UI =================
        function buildTreeUI(esoData) {
            const container = document.getElementById('tree-container');
            container.innerHTML = '';
            materialNodes.clear();

            const esoNode = createTreeNode(`📦 ${esoData.filename || 'model'}.eso`, true);
            container.appendChild(esoNode.element);

            const modelsGroup = new Map();
            esoData.models.forEach(m => {
                if (!modelsGroup.has(m.matHash)) modelsGroup.set(m.matHash, 0);
                modelsGroup.set(m.matHash, modelsGroup.get(m.matHash) + (m.indices.length / 3));
            });

            modelsGroup.forEach((triCount, matHash) => {
                const matNode = createTreeNode(`🎨 材质 ${matHash} (${triCount} 面)`, false);

                // 状态 span（[已贴图] / [纯色]）
                const statusSpan = document.createElement('span');
                statusSpan.className = 'material-status';
                statusSpan.style.marginLeft = '4px';
                matNode.label.appendChild(statusSpan);

                materialNodes.set(matHash, matNode);
                updateMaterialStatus(matHash);

                // 内联控制面板
                matNode.childrenContainer.appendChild(createMaterialPanel(matHash));

                esoNode.childrenContainer.appendChild(matNode.element);
            });

            esoNode.element.querySelector('.tree-children').classList.add('open');
        }

        function createTreeNode(text, isOpen) {
            const div = document.createElement('div');
            const label = document.createElement('div');
            label.className = 'tree-node';
            label.innerHTML = `<span class="tree-icon">${isOpen ? '▼' : '▶'}</span>${text}`;

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children';

            label.addEventListener('click', () => {
                childrenContainer.classList.toggle('open');
                const icon = label.querySelector('.tree-icon');
                icon.innerText = childrenContainer.classList.contains('open') ? '▼' : '▶';
            });

            div.appendChild(label);
            div.appendChild(childrenContainer);
            return { element: div, label, childrenContainer };
        }

        // ================= 材质内联控制面板 =================
        function createMaterialPanel(matHash) {
            const panel = document.createElement('div');
            panel.className = 'material-panel';

            // 1) 导入本地图片
            const importBtn = document.createElement('button');
            importBtn.textContent = '📁 导入图片';
            importBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (ev) => {
                    const file = ev.target.files[0];
                    if (file) applyTexture(matHash, URL.createObjectURL(file));
                };
                input.click();
            });
            panel.appendChild(importBtn);

            // 2) 预设贴图 0 ~ 3
            const presetRow = document.createElement('div');
            presetRow.className = 'preset-row';
            PRESET_TEXTURES.forEach((base64, index) => {
                const btn = document.createElement('button');
                btn.textContent = index;
                btn.title = base64 ? `预设贴图 ${index}` : `预设 ${index}（未配置 base64）`;
                if (!base64) btn.disabled = true;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (base64) applyTexture(matHash, base64);
                });
                presetRow.appendChild(btn);
            });
            panel.appendChild(presetRow);

            // 3) 纯色调色板
            const colorRow = document.createElement('div');
            colorRow.className = 'color-row';

            const colorInput = document.createElement('input');
            colorInput.type = 'color';
            colorInput.value = '#ffffff';

            const applyColorBtn = document.createElement('button');
            applyColorBtn.textContent = '上色';
            applyColorBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                applyColor(matHash, colorInput.value);
            });

            // 拖动调色时实时预览
            colorInput.addEventListener('input', (e) => {
                e.stopPropagation();
                applyColor(matHash, colorInput.value);
            });

            colorRow.appendChild(colorInput);
            colorRow.appendChild(applyColorBtn);
            panel.appendChild(colorRow);

            // 4) 恢复默认
            const clearBtn = document.createElement('button');
            clearBtn.className = 'clear-btn';
            clearBtn.textContent = '🗑 恢复默认材质';
            clearBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                clearMaterialOverride(matHash);
            });
            panel.appendChild(clearBtn);

            return panel;
        }

        // ================= 材质应用 =================
        function applyTexture(matHash, url) {
            const loader = new THREE.TextureLoader();
            const tex = loader.load(url);
            tex.flipY = false;
            tex.encoding = THREE.sRGBEncoding;

            if (materialTextures.has(matHash)) {
                const old = materialTextures.get(matHash);
                if (old !== tex) old.dispose();
            }
            materialTextures.set(matHash, tex);
            materialColors.delete(matHash);

            updateMaterial(matHash);
            updateMaterialStatus(matHash);
        }

        function applyColor(matHash, hex) {
            materialColors.set(matHash, parseInt(hex.replace('#', '0x'), 16));
            if (materialTextures.has(matHash)) {
                materialTextures.get(matHash).dispose();
                materialTextures.delete(matHash);
            }
            updateMaterial(matHash);
            updateMaterialStatus(matHash);
        }

        function clearMaterialOverride(matHash) {
            if (materialTextures.has(matHash)) {
                materialTextures.get(matHash).dispose();
                materialTextures.delete(matHash);
            }
            materialColors.delete(matHash);
            updateMaterial(matHash);
            updateMaterialStatus(matHash);
        }

        // 只更新对应 mesh 的材质，不重建场景/相机
        function updateMaterial(matHash) {
            if (!currentObject) return;
            currentObject.traverse(child => {
                if (!child.isMesh || child.userData.matHash !== matHash) return;

                const mat = child.material;
                const hadMap = !!mat.map;
                const hadVC = mat.vertexColors;

                if (materialTextures.has(matHash)) {
                    mat.map = materialTextures.get(matHash);
                    mat.color.setHex(0xffffff);
                    mat.vertexColors = false;
                } else if (materialColors.has(matHash)) {
                    mat.map = null;
                    mat.color.set(materialColors.get(matHash));
                    mat.vertexColors = false;
                } else {
                    mat.map = null;
                    mat.color.setHex(0xffffff);
                    mat.vertexColors = !!child.geometry.attributes.color;
                }

                // 只有 shader 宏变化时才需要重新编译
                if (hadMap !== !!mat.map || hadVC !== mat.vertexColors) {
                    mat.needsUpdate = true;
                }
            });
        }

        function updateMaterialStatus(matHash) {
            const matNode = materialNodes.get(matHash);
            if (!matNode) return;
            const span = matNode.label.querySelector('.material-status');
            if (!span) return;
            if (materialTextures.has(matHash)) {
                span.innerHTML = '<span style="color:#4caf50;">[已贴图]</span>';
            } else if (materialColors.has(matHash)) {
                span.innerHTML = '<span style="color:#ffeb3b;">[纯色]</span>';
            } else {
                span.innerHTML = '';
            }
        }

        // 首次加载 ESO 时，按文件名自动匹配 filePool 里的图片
        function autoMatchTextures(esoData) {
            esoData.models.forEach(m => {
                if (materialTextures.has(m.matHash) || materialColors.has(m.matHash)) return;
                for (const [name, data] of filePool.entries()) {
                    if (!data.url) continue;
                    if (name.toLowerCase().includes(m.matHash.toLowerCase()) &&
                        (name.endsWith('.png') || name.endsWith('.jpg'))) {
                        const loader = new THREE.TextureLoader();
                        const tex = loader.load(data.url);
                        tex.flipY = false;
                        tex.encoding = THREE.sRGBEncoding;
                        materialTextures.set(m.matHash, tex);
                        break;
                    }
                }
            });
        }

        // ================= ESO -> XML =================
        function generateXMLString(data) {
            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<Models V01="${data.v01}" V02="${data.v02}" `;
            xml += `NodeChild="${data.hash1}" NodeSibling="${data.hash2}" V07="${data.v07}" V08="${data.v08}" V09="${data.v09}" `;
            xml += `ScaleXYZ="${data.scaleXYZ}" Translate="${data.translate.join(',')}" Rotate="${data.rotate.join(',')}" Scale="${data.scale.join(',')}" `;
            xml += `V20="${data.v20}" V21="${data.v21}" BoundingMin="${data.bMin.join(',')}" BoundingMax="${data.bMax.join(',')}">\n`;

            data.models.forEach(m => {
                xml += `  <Model MaterialAsset="${m.matHash}">\n`;
                for (let i = 0; i < m.indices.length; i += 3) {
                    xml += `    <Triangle>\n`;
                    for (let j = 0; j < 3; j++) {
                        const idx = m.indices[i + j];
                        const px = m.positions[idx * 3].toFixed(6);
                        const py = m.positions[idx * 3 + 1].toFixed(6);
                        const pz = m.positions[idx * 3 + 2].toFixed(6);
                        xml += `      <Vertex Position="${px},${py},${pz}"`;
                        if (m.normals) {
                            xml += ` Normal="${m.normals[idx * 3].toFixed(6)},${m.normals[idx * 3 + 1].toFixed(6)},${m.normals[idx * 3 + 2].toFixed(6)}"`;
                        }
                        if (m.colors) {
                            const r = Math.floor(m.colors[idx * 3] * 255).toString(16).padStart(2, '0');
                            const g = Math.floor(m.colors[idx * 3 + 1] * 255).toString(16).padStart(2, '0');
                            const b = Math.floor(m.colors[idx * 3 + 2] * 255).toString(16).padStart(2, '0');
                            xml += ` Color="#${r}${g}${b}"`;
                        }
                        if (m.uvs) {
                            xml += ` TexCoord="${m.uvs[idx * 2].toFixed(6)},${m.uvs[idx * 2 + 1].toFixed(6)}"`;
                        }
                        xml += ` />\n`;
                    }
                    xml += `    </Triangle>\n`;
                }
                xml += `  </Model>\n`;
            });
            xml += `</Models>`;
            return xml;
        }

        // ================= 文件处理 =================
        function handleFiles(files) {
            const promises = Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const name = file.name;
                    const reader = new FileReader();

                    if (name.endsWith('.eso')) {
                        reader.onload = (e) => {
                            const buffer = e.target.result;
                            filePool.set(name, { file, buffer });
                            try {
                                currentESOData = parseESO(buffer);
                                autoMatchTextures(currentESOData);
                                renderESO(currentESOData);
                            } catch (err) {
                                console.error('解析 ESO 失败', err);
                                alert('解析 ESO 失败，可能不是有效的 Models 文件。');
                            }
                            resolve();
                        };
                        reader.readAsArrayBuffer(file);
                    } else if (name.endsWith('.png') || name.endsWith('.jpg')) {
                        const url = URL.createObjectURL(file);
                        filePool.set(name, { file, url });

                        if (currentESOData) {
                            currentESOData.models.forEach(m => {
                                if (name.toLowerCase().includes(m.matHash.toLowerCase()) &&
                                    !materialTextures.has(m.matHash) &&
                                    !materialColors.has(m.matHash)) {
                                    const loader = new THREE.TextureLoader();
                                    const tex = loader.load(url);
                                    tex.flipY = false;
                                    tex.encoding = THREE.sRGBEncoding;
                                    materialTextures.set(m.matHash, tex);
                                    updateMaterial(m.matHash);
                                    updateMaterialStatus(m.matHash);
                                }
                            });
                        }
                        resolve();
                    } else {
                        resolve();
                    }
                });
            });

            Promise.all(promises);
        }

        // ================= UI 事件绑定 =================
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        document.getElementById('wireframe').addEventListener('change', (e) => {
            if (currentObject) {
                currentObject.traverse(child => {
                    if (child.isMesh) child.material.wireframe = e.target.checked;
                });
            }
        });

        document.getElementById('show-axes').addEventListener('change', (e) => {
            if (axesHelper) axesHelper.visible = e.target.checked;
        });

        document.getElementById('btn-export-xml').addEventListener('click', () => {
            if (!currentESOData) return;
            document.getElementById('xml-output').value = generateXMLString(currentESOData);
            document.getElementById('modal').style.display = 'flex';
        });

        window.downloadXml = function () {
            const blob = new Blob([document.getElementById('xml-output').value], { type: 'text/xml' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (currentESOData.filename || 'model') + '.xml';
            a.click();
        };

        initThree();
    }
    </script>
</head>
<body>

<div id="sidebar">
    <div id="sidebar-header">
        <h3 style="margin:0 0 10px 0;">EDGE 资源加载器</h3>
        <div id="drop-zone">
            拖拽 .eso / .png 文件到这里<br>
            <small>(可多选，自动匹配材质)</small>
        </div>
        <input type="file" id="file-input" multiple accept=".eso,.xml,.png,.jpg">
    </div>

    <div id="tree-container">
        <div style="color:#888; font-style:italic;">等待加载模型...</div>
    </div>

    <div id="controls">
        <div class="control-row">
            <label><input type="checkbox" id="wireframe"> 线框模式</label>
            <label><input type="checkbox" id="show-axes" checked> 坐标轴</label>
        </div>
        <div class="control-row">
            <button id="btn-export-xml" disabled>导出 XML</button>
            <button id="btn-compile-eso" disabled>编译为 ESO</button>
        </div>
        <div class="control-row" style="font-size:11px; color:#888; margin-top:5px;">
            提示: 展开材质节点可导入贴图 / 选择预设 / 调色
        </div>
    </div>
</div>

<div id="viewport">
